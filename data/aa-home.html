<h3>Home-Menu</h3>

<button onclick="loadArticle('a-home.html');"><img class="icon" src="./icons/home.svg" />Force Sensor</button>
<button onclick="loadArticle('a-diagnose.html');"><img class="icon" src="./icons/eye.svg" />Diagnose</button>
<button onclick="window.location.href='fsensor.html';">Full Screen</button>


<div id="spinner-container" class="spinner-container">
    <fieldset>
        <legend>Select refresh rate:</legend>
    
        <div>
          <input type="radio" id="off" name="refresh" onClick="changeRefreshRate(0);">
          <label for="off">Off</label>
        </div>

        <div>
          <input type="radio" id="fast" name="refresh" checked onClick="changeRefreshRate(500);">
          <label for="fast">Fast 0.5s</label>

          <input type="radio" id="slow" name="refresh" onClick="changeRefreshRate(1000);">
          <label for="slow">Slow 1s</label>
        </div>
    </fieldset>
</div>
